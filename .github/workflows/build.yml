name: Build

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      # The tests compile the shaders and call them on the GPU: a virtual display and the software OpenGL of Mesa give them a context
      - name: Install software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libglx-mesa0

      - name: Build
        env:
          VENTA_REQUIRE_OPENGL: "true"
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: set -o pipefail && xvfb-run -a -s "-screen 0 1280x1024x24" mvn -B package | tee maven-build.log

      - name: Upload Maven logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-logs
          path: maven-build.log